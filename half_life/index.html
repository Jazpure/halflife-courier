<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HalfLife Courier</title>
<style>
  :root {
    --paper: #eddcd8;   /* muted light pink */
    --ink: #1f2a52;     /* navy */
  }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  /* paper: a faint, fixed grain over the page colour */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.55;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.42  0 0 0 0 0.26  0 0 0 0 0.28  0 0 0 0.08 0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
  }
  header { position: relative; z-index: 2; padding: 34px 0 0; }
  h1 { margin: 0; font-size: clamp(30px, 4.4vw, 60px); line-height: 1; letter-spacing: -0.01em; font-weight: 700; }
  .half { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-style: italic; font-weight: 700; }
  .courier { font-family: "Courier New", Courier, monospace; font-weight: 400; font-size: 1.14em; letter-spacing: 0; }
  #sheet { position: absolute; top: 0; left: 0; right: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .blk { position: absolute; display: block; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<header><h1><span class="half">HalfLife</span> <span class="courier">Courier</span></h1></header>
<p class="sr">All work and no play makes Jack a dull boy, repeated in four columns, decaying as the page goes on until it can no longer be read.</p>
<div id="sheet" aria-hidden="true"></div>
<script src="schedule.js"></script>
<script src="page.js"></script>
</body>
</html>
